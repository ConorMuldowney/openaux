name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  prisma-migrate-deploy:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - githubEnvironment: development
            databaseUrlSecret: DEV_DATABASE_URL
          - githubEnvironment: preview
            databaseUrlSecret: PREVIEW_DATABASE_URL
          - githubEnvironment: production
            databaseUrlSecret: PROD_DATABASE_URL

    environment: ${{ matrix.githubEnvironment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:deploy

      - name: Validate migration state
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:status
