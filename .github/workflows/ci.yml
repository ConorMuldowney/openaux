name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  preview-deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    environment: preview
    # This job assumes Vercel for Next.js preview deployment.
    # For other hosting platforms, customize the deployment steps below.

    steps:
      - name: Comment PR with Preview Deploy Info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const previewComment = comments.find(comment => 
              comment.body.includes('🚀 **Preview Deploy**')
            );
            
            const body = '🚀 **Preview Deploy**\n\nPreview deployment is configured in this workflow. Deployment URL will appear here when integrated with hosting provider (Vercel, Netlify, etc.).\n\nSee [docs/ci-github-actions.md](../../docs/ci-github-actions.md) for setup details.';
            
            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  prisma-migrate-deploy:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - githubEnvironment: development
            databaseUrlSecret: DEV_DATABASE_URL
          - githubEnvironment: preview
            databaseUrlSecret: PREVIEW_DATABASE_URL
          - githubEnvironment: production
            databaseUrlSecret: PROD_DATABASE_URL

    environment: ${{ matrix.githubEnvironment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:deploy

      - name: Validate migration state
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:status
