name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  quality:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Test (Unit + Integration + E2E)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openaux_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openaux_test
      # Playwright needs a base URL; the webServer in playwright.config.ts starts next dev
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview-deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    environment: preview
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # This job assumes Vercel for Next.js preview deployment.
    # For other hosting platforms, customize the deployment steps below.

    steps:
      - name: Comment PR with Preview Deploy Info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const previewComment = comments.find(comment => 
              comment.body.includes('🚀 **Preview Deploy**')
            );
            
            const body = '🚀 **Preview Deploy**\n\nPreview deployment is configured in this workflow. Deployment URL will appear here when integrated with hosting provider (Vercel, Netlify, etc.).\n\nSee [docs/ci-github-actions.md](../../docs/ci-github-actions.md) for setup details.';
            
            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  prisma-migrate-deploy:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - githubEnvironment: development
            databaseUrlSecret: DEV_DATABASE_URL
          - githubEnvironment: preview
            databaseUrlSecret: PREVIEW_DATABASE_URL
          - githubEnvironment: production
            databaseUrlSecret: PROD_DATABASE_URL

    environment: ${{ matrix.githubEnvironment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:deploy

      - name: Validate migration state
        env:
          DATABASE_URL: ${{ secrets[matrix.databaseUrlSecret] }}
        run: npm run prisma:migrate:status
